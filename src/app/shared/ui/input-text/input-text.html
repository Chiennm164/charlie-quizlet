<div class="field">
  @if (label()) {
    <label class="field__label" [class.field__label-required]="required()">{{ label() }}</label>
  }
  <div class="relative">
    <input
      class="input"
      [class.pr-10]="isPassword()"
      [type]="inputType()"
      [attr.inputmode]="numericOnly() ? 'numeric' : null"
      [class.is-invalid]="!!errorMessage()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($event)"
      [attr.autocomplete]="autocomplete()"
      [attr.name]="name()"
      (blur)="onTouched()"
    />
    @if (isPassword()) {
      <button
        type="button"
        class="absolute inset-y-0 right-0 flex items-center px-3 text-text-muted hover:text-text disabled:cursor-not-allowed"
        [disabled]="disabled()"
        [attr.aria-label]="
          (passwordVisible() ? 'common.hidePassword' : 'common.showPassword') | translate
        "
        [attr.aria-pressed]="passwordVisible()"
        (click)="passwordVisible.set(!passwordVisible())"
      >
        <app-icon [name]="passwordVisible() ? 'eye-off' : 'eye'" [size]="18" />
      </button>
    }
  </div>
  <app-text-error [message]="errorMessage()" />
</div>
