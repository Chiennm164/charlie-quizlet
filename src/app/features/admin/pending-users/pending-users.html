<app-page-header
  [title]="'admin.pendingUsers.title' | translate"
  [description]="'admin.pendingUsers.description' | translate"
/>

<section class="card-surface" [attr.aria-busy]="loading()">
  <app-table
    [columns]="columns()"
    [rows]="users()"
    [trackBy]="trackById"
    [emptyText]="(loading() ? 'common.loading' : 'admin.pendingUsers.empty') | translate"
  >
    <ng-template #rowActions let-row>
      <div class="flex justify-end gap-2">
        <app-button
          size="sm"
          [loading]="processingId() === asUser(row).id && !rejecting()"
          [disabled]="processingId() !== null"
          (clicked)="approve(asUser(row))"
        >
          {{ 'admin.pendingUsers.approve' | translate }}
        </app-button>
        <app-button
          size="sm"
          variant="secondary"
          [disabled]="processingId() !== null"
          (clicked)="rejecting.set(asUser(row))"
        >
          {{ 'admin.pendingUsers.reject' | translate }}
        </app-button>
      </div>
    </ng-template>
  </app-table>
</section>

<app-dialog
  size="sm"
  [open]="rejecting() !== null"
  [title]="'admin.pendingUsers.rejectTitle' | translate"
  (closed)="rejecting.set(null)"
>
  <p class="typo-body-sm">
    {{ 'admin.pendingUsers.rejectConfirm' | translate: { name: rejecting()?.fullName ?? '' } }}
  </p>
  <div dialog-footer class="flex justify-end gap-2">
    <app-button variant="secondary" (clicked)="rejecting.set(null)">
      {{ 'common.cancel' | translate }}
    </app-button>
    <app-button variant="danger" [loading]="processingId() !== null" (clicked)="confirmReject()">
      {{ 'admin.pendingUsers.reject' | translate }}
    </app-button>
  </div>
</app-dialog>
