<app-auth-layout
  page="forgotPassword"
  [title]="'auth.forgotPasswordTitle' | translate"
  [subtitle]="
    (sentTo() ? 'auth.forgotPasswordSentSubtitle' : 'auth.forgotPasswordSubtitle') | translate
  "
>
  @if (sentTo(); as email) {
    <div class="flex flex-col gap-4" animate.enter="anim-fade-in">
      <p class="typo-body-sm">
        {{ 'auth.forgotPasswordSent' | translate }} <strong>{{ email }}</strong>
      </p>
      <app-button variant="secondary" [block]="true" (clicked)="sentTo.set(null)">
        {{ 'auth.forgotPasswordResend' | translate }}
      </app-button>
    </div>
  } @else {
    <form
      [formGroup]="form"
      [attr.aria-busy]="submitting()"
      (ngSubmit)="submit()"
      class="flex flex-col gap-2"
      animate.enter="anim-fade-in"
      novalidate
    >
      <app-input-text
        type="email"
        name="email"
        autocomplete="username"
        [label]="'auth.email' | translate"
        [placeholder]="'auth.emailPlaceholder' | translate"
        [required]="true"
        formControlName="email"
        [errorMessage]="emailError()"
      />

      <app-button type="submit" [block]="true" [loading]="submitting()">
        {{ 'auth.forgotPasswordButton' | translate }}
      </app-button>
    </form>
  }

  <ng-container authFooter>
    <a [routerLink]="routes.login" class="link">{{ 'auth.backToLogin' | translate }}</a>
  </ng-container>
</app-auth-layout>
