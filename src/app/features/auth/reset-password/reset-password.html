<app-auth-layout
  page="resetPassword"
  [title]="'auth.resetPasswordTitle' | translate"
  [subtitle]="'auth.resetPasswordSubtitle' | translate"
>
  @if (token && !tokenInvalid()) {
    <form
      [formGroup]="form"
      [attr.aria-busy]="submitting()"
      (ngSubmit)="submit()"
      class="flex flex-col gap-2"
      novalidate
    >
      <app-input-text
        type="password"
        name="new-password"
        autocomplete="new-password"
        [label]="'auth.newPassword' | translate"
        [required]="true"
        formControlName="newPassword"
        [errorMessage]="errorFor('newPassword')"
      />

      <app-input-text
        type="password"
        name="confirm-password"
        autocomplete="new-password"
        [label]="'auth.confirmPassword' | translate"
        [required]="true"
        formControlName="confirmPassword"
        [errorMessage]="errorFor('confirmPassword')"
      />

      <app-button type="submit" [block]="true" [loading]="submitting()">{{
        'auth.resetPasswordButton' | translate
      }}</app-button>
    </form>
  } @else {
    <div class="flex flex-col gap-4" animate.enter="anim-fade-in">
      <app-text-error [message]="'auth.resetLinkInvalid' | translate" [reserveSpace]="false" />
      <a [routerLink]="routes.forgotPassword" class="link text-body-sm">
        {{ 'auth.requestNewLink' | translate }}
      </a>
    </div>
  }

  <ng-container authFooter>
    <a [routerLink]="routes.login" class="link">{{ 'auth.backToLogin' | translate }}</a>
  </ng-container>
</app-auth-layout>
