<app-page-header
  [title]="'profile.title' | translate"
  [description]="'profile.description' | translate"
/>

<div class="grid gap-6 lg:grid-cols-2 items-start">
  <section class="bg-surface border border-border rounded-lg p-4 anim-slide-up-in">
    <h2 class="typo-section-title mb-3">{{ 'profile.infoTitle' | translate }}</h2>
    <form
      [formGroup]="profileForm"
      [attr.aria-busy]="savingProfile()"
      (ngSubmit)="saveProfile()"
      class="flex flex-col gap-2"
      novalidate
    >
      <div class="field">
        <span class="field__label">{{ 'auth.email' | translate }}</span>
        <p class="typo-body break-all">{{ email }}</p>
      </div>

      <app-input-text
        name="name"
        autocomplete="name"
        [label]="'auth.fullName' | translate"
        [required]="true"
        formControlName="fullName"
        [errorMessage]="fullNameError()"
      />

      <div class="flex justify-end">
        <app-button type="submit" [loading]="savingProfile()">
          {{ 'common.save' | translate }}
        </app-button>
      </div>
    </form>
  </section>

  <section class="bg-surface border border-border rounded-lg p-4 anim-slide-up-in" style="--i: 1">
    <h2 class="typo-section-title">{{ 'profile.passwordTitle' | translate }}</h2>
    <p class="typo-muted mt-1 mb-3">{{ 'profile.passwordHint' | translate }}</p>
    <form
      [formGroup]="passwordForm"
      [attr.aria-busy]="changingPassword()"
      (ngSubmit)="changePassword()"
      class="flex flex-col gap-2"
      novalidate
    >
      <!-- Ô ẩn giúp trình quản lý mật khẩu biết mật khẩu này thuộc tài khoản nào. -->
      <input type="email" name="username" autocomplete="username" [value]="email" hidden />

      <app-input-text
        type="password"
        name="current-password"
        autocomplete="current-password"
        [label]="'profile.currentPassword' | translate"
        [required]="true"
        formControlName="currentPassword"
        [errorMessage]="passwordError('currentPassword')"
      />

      <app-input-text
        type="password"
        name="new-password"
        autocomplete="new-password"
        [label]="'auth.newPassword' | translate"
        [required]="true"
        formControlName="newPassword"
        [errorMessage]="passwordError('newPassword')"
      />

      <app-input-text
        type="password"
        name="confirm-password"
        autocomplete="new-password"
        [label]="'auth.confirmPassword' | translate"
        [required]="true"
        formControlName="confirmPassword"
        [errorMessage]="passwordError('confirmPassword')"
      />

      <div class="flex justify-end">
        <app-button type="submit" [loading]="changingPassword()">
          {{ 'profile.changePasswordButton' | translate }}
        </app-button>
      </div>
    </form>
  </section>
</div>
