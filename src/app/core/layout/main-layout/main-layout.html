<div class="min-h-screen app-backdrop flex flex-col">
  <header class="app-header bg-surface border-b border-border">
    <div class="max-w-6xl mx-auto px-4 h-14 sm:h-16 flex items-center gap-3 sm:gap-6">
      <a
        [routerLink]="homeRoute"
        [attr.aria-label]="appName"
        class="rounded-md transition-opacity hover:opacity-80"
        ><app-brand [hideNameOnMobile]="true"
      /></a>

      <app-header-search class="flex-1 min-w-0 sm:max-w-lg sm:mx-auto" />

      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        @if (auth.currentUser(); as user) {
          <button
            type="button"
            class="flex items-center gap-2 rounded-md px-1 py-0.5 transition-colors hover:bg-bg-muted"
            aria-haspopup="dialog"
            [attr.aria-label]="'account.title' | translate"
            (click)="accountOpen.set(true)"
          >
            <span
              class="w-8 h-8 rounded-full bg-primary-soft text-primary flex items-center justify-center text-body-sm font-semibold"
              aria-hidden="true"
            >
              {{ initials() }}
            </span>
            <span class="hidden md:inline typo-body-sm font-medium">{{ user.fullName }}</span>
          </button>
        }

        <button
          type="button"
          class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-body-sm text-text-muted hover:text-danger hover:bg-bg-muted cursor-pointer"
          [attr.aria-label]="'home.logout' | translate"
          (click)="logout()"
        >
          <app-icon name="logout" [size]="18" />
          <span class="hidden sm:inline">{{ 'home.logout' | translate }}</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="app-nav" [attr.aria-label]="'nav.label' | translate">
    <div class="max-w-6xl mx-auto px-4 flex items-center gap-1 overflow-x-auto">
      <a
        class="app-nav__link"
        [routerLink]="quizzesRoute"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        <app-icon name="book-open" />
        {{ 'nav.quizzes' | translate }}
      </a>
      <a
        class="app-nav__link"
        [routerLink]="historyRoute"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        <app-icon name="clock" />
        {{ 'nav.history' | translate }}
      </a>
      @if (auth.hasRole('ADMIN')) {
        <span class="app-nav__divider" aria-hidden="true"></span>
        <span class="app-nav__title">{{ 'nav.admin' | translate }}</span>
        <a
          class="app-nav__link"
          [routerLink]="adminQuizzesRoute"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <app-icon name="clipboard-check" />
          {{ 'nav.manageQuizzes' | translate }}
        </a>
        <a
          class="app-nav__link"
          [routerLink]="adminTopicsRoute"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <app-icon name="layers" />
          {{ 'nav.topics' | translate }}
        </a>
      }
    </div>
  </nav>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-6">
    <router-outlet />
  </main>
</div>

<app-account-dialog [open]="accountOpen()" (closed)="accountOpen.set(false)" />
